<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>
      .f{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
      .t{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
      .d{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14.5px;fill:#A99BC8}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090712"/><stop offset="1" stop-color="#0E0613"/></linearGradient>
    <radialGradient id="g" cx=".5" cy="0" r=".7"><stop offset="0" stop-color="#7A00F0" stop-opacity=".35"/><stop offset="1" stop-color="#7A00F0" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171326"/><stop offset="1" stop-color="#0E0C17"/></linearGradient>
    <linearGradient id="i1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B30FF"/><stop offset="1" stop-color="#4A0099"/></linearGradient>
    <linearGradient id="i2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00b7d8"/><stop offset="1" stop-color="#5a12b8"/></linearGradient>
    <linearGradient id="i3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e59b"/><stop offset="1" stop-color="#0077b6"/></linearGradient>
    <linearGradient id="i4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2bd6"/><stop offset="1" stop-color="#7A00F0"/></linearGradient>
    <linearGradient id="i5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a18"/><stop offset="1" stop-color="#ED1908"/></linearGradient>
    <linearGradient id="i6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A00F0"/><stop offset=".5" stop-color="#ED1908"/><stop offset="1" stop-color="#B266FF"/></linearGradient>
    <linearGradient id="i7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B266FF"/><stop offset="1" stop-color="#ED1908"/></linearGradient>
    <linearGradient id="i8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f6fc"/><stop offset="1" stop-color="#9ba19d"/></linearGradient>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#g)"/>
  <text x="640" y="80" text-anchor="middle" class="f" font-size="42" font-weight="800" fill="#fff">Everything in one platform</text>
  <text x="640" y="116" text-anchor="middle" class="f" font-size="18" fill="#9D91BA">The tools you need every day — each one a sentence away</text>

  <!-- row 1 -->
  <g transform="translate(48 152)">
    <rect width="278" height="206" rx="20" fill="url(#card)" stroke="#C8BAE3" stroke-opacity=".12"/>
    <rect x="22" y="22" width="50" height="50" rx="15" fill="url(#i1)"/><text x="47" y="55" text-anchor="middle" class="f" font-size="22" fill="#fff">✦</text>
    <text x="22" y="110" class="t">Smart chat</text>
    <text x="22" y="140" class="d">ChatGPT-style, with memory</text>
    <text x="22" y="162" class="d">and real tools: PDF, Word, charts,</text>
    <text x="22" y="184" class="d">web search, files and more</text>
  </g>
  <g transform="translate(346 152)">
    <rect width="278" height="206" rx="20" fill="url(#card)" stroke="#C8BAE3" stroke-opacity=".12"/>
    <rect x="22" y="22" width="50" height="50" rx="15" fill="url(#i2)"/><text x="47" y="54" text-anchor="middle" font-family="Consolas,monospace" font-weight="700" font-size="17" fill="#fff">&lt;/&gt;</text>
    <text x="22" y="110" class="t">BldBox Code</text>
    <text x="22" y="140" class="d">Describe an app, get the whole</text>
    <text x="22" y="162" class="d">project: frontend + backend,</text>
    <text x="22" y="184" class="d">live preview, ZIP or GitHub push</text>
  </g>
  <g transform="translate(644 152)">
    <rect width="278" height="206" rx="20" fill="url(#card)" stroke="#C8BAE3" stroke-opacity=".12"/>
    <rect x="22" y="22" width="50" height="50" rx="15" fill="url(#i3)"/><text x="47" y="55" text-anchor="middle" class="f" font-size="22" fill="#fff">⚙</text>
    <text x="22" y="110" class="t">Custom agents</text>
    <text x="22" y="140" class="d">Chain capabilities into your own</text>
    <text x="22" y="162" class="d">assistant with a system prompt,</text>
    <text x="22" y="184" class="d">knowledge files and a model</text>
  </g>
  <g transform="translate(942 152)">
    <rect width="290" height="206" rx="20" fill="url(#card)" stroke="#C8BAE3" stroke-opacity=".12"/>
    <rect x="22" y="22" width="50" height="50" rx="15" fill="url(#i4)"/><text x="47" y="55" text-anchor="middle" class="f" font-size="22" fill="#fff">◐</text>
    <text x="22" y="110" class="t">Images</text>
    <text x="22" y="140" class="d">Generate and edit images,</text>
    <text x="22" y="162" class="d">collages and watermarks with</text>
    <text x="22" y="184" class="d">a choice of image models</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(48 382)">
    <rect width="278" height="206" rx="20" fill="url(#card)" stroke="#C8BAE3" stroke-opacity=".12"/>
    <rect x="22" y="22" width="50" height="50" rx="15" fill="url(#i5)"/><text x="47" y="55" text-anchor="middle" class="f" font-size="22" fill="#fff">◉</text>
    <text x="22" y="110" class="t">Voice</text>
    <text x="22" y="140" class="d">Live dictation and hands-free</text>
    <text x="22" y="162" class="d">voice conversations that auto-</text>
    <text x="22" y="184" class="d">send when you stop speaking</text>
  </g>
  <g transform="translate(346 382)">
    <rect width="278" height="206" rx="20" fill="url(#card)" stroke="#B266FF" stroke-opacity=".45"/>
    <rect x="22" y="22" width="50" height="50" rx="15" fill="url(#i6)"/><text x="47" y="56" text-anchor="middle" class="f" font-size="24" fill="#fff">🌍</text>
    <text x="22" y="110" class="t">AI World Builder</text>
    <text x="22" y="140" class="d">Grow 2D, pixel, blocky, LEGO-like,</text>
    <text x="22" y="162" class="d">3D and anime worlds all around,</text>
    <text x="22" y="184" class="d">then link them with other worlds</text>
    <rect x="200" y="22" width="58" height="22" rx="11" fill="#ED1908"/><text x="229" y="38" text-anchor="middle" class="f" font-size="12" font-weight="700" fill="#fff">NEW</text>
  </g>
  <g transform="translate(644 382)">
    <rect width="278" height="206" rx="20" fill="url(#card)" stroke="#B266FF" stroke-opacity=".45"/>
    <rect x="22" y="22" width="50" height="50" rx="15" fill="url(#i7)"/><text x="47" y="55" text-anchor="middle" class="f" font-size="22" fill="#fff">✎</text>
    <text x="22" y="110" class="t">SEO blog + AI writer</text>
    <text x="22" y="140" class="d">Articles and custom HTML pages,</text>
    <text x="22" y="162" class="d">scheduled AI writing, sitemap and</text>
    <text x="22" y="184" class="d">instant Google / IndexNow pings</text>
    <rect x="200" y="22" width="58" height="22" rx="11" fill="#ED1908"/><text x="229" y="38" text-anchor="middle" class="f" font-size="12" font-weight="700" fill="#fff">NEW</text>
  </g>
  <g transform="translate(942 382)">
    <rect width="290" height="206" rx="20" fill="url(#card)" stroke="#B266FF" stroke-opacity=".45"/>
    <rect x="22" y="22" width="50" height="50" rx="15" fill="url(#i8)"/>
    <path transform="translate(31 31) scale(2)" fill="#0d1117" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    <text x="22" y="110" class="t">GitHub &amp; languages</text>
    <text x="22" y="140" class="d">Sign in with GitHub, push files to</text>
    <text x="22" y="162" class="d">repos, Marketplace webhooks — and</text>
    <text x="22" y="184" class="d">a full English or Persian interface</text>
    <rect x="212" y="22" width="58" height="22" rx="11" fill="#ED1908"/><text x="241" y="38" text-anchor="middle" class="f" font-size="12" font-weight="700" fill="#fff">NEW</text>
  </g>
</svg>
