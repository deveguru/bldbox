<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <radialGradient id="g1" cx="12%" cy="0%" r="70%">
      <stop offset="0" stop-color="#7A00F0" stop-opacity=".75"/><stop offset="1" stop-color="#7A00F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="92%" cy="15%" r="55%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".45"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="60%" cy="120%" r="60%">
      <stop offset="0" stop-color="#ED1908" stop-opacity=".35"/><stop offset="1" stop-color="#ED1908" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDD3F0"/><stop offset="1" stop-color="#B266FF"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B30FF"/><stop offset=".55" stop-color="#6200CC"/><stop offset="1" stop-color="#4A0099"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="#050508"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="28" fill="url(#g1)"/>
  <rect width="1280" height="420" rx="28" fill="url(#g2)"/>
  <rect width="1280" height="420" rx="28" fill="url(#g3)"/>
  <rect x="0" y="0" width="1280" height="2" fill="#00E5FF" opacity=".35">
    <animate attributeName="y" values="0;420;0" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(1010 210)" opacity=".9">
    <circle r="120" fill="none" stroke="#9B30FF" stroke-opacity=".35" stroke-dasharray="4 10"/>
    <circle r="78" fill="none" stroke="#00E5FF" stroke-opacity=".3" stroke-dasharray="2 8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <circle cx="120" cy="0" r="7" fill="#B266FF" filter="url(#glow)"/>
      <circle cx="-120" cy="0" r="4" fill="#00E5FF" filter="url(#glow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      <circle cx="0" cy="78" r="5" fill="#FF3D2E" filter="url(#glow)"/>
      <circle cx="0" cy="-78" r="4" fill="#DDD3F0"/>
    </g>
    <rect x="-42" y="-42" width="84" height="84" rx="24" fill="url(#mark)" filter="url(#glow)"/>
    <text x="0" y="17" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="50" fill="#fff">B</text>
  </g>
  <text x="80" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="7" fill="#00E5FF" opacity=".9">AI WORKSHOP</text>
  <text x="76" y="250" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="104" fill="url(#txt)">BldBox<tspan fill="#9B30FF">.</tspan></text>
  <text x="80" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#A99BC8">Just say what you want — it picks the tools and gets it done.</text>
  <g font-family="Consolas,monospace" font-size="15" fill="#DDD3F0">
    <rect x="80" y="335" width="132" height="36" rx="18" fill="#7A00F0" fill-opacity=".18" stroke="#9B30FF" stroke-opacity=".5"/>
    <text x="146" y="358" text-anchor="middle">AI chat</text>
    <rect x="224" y="335" width="150" height="36" rx="18" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".45"/>
    <text x="299" y="358" text-anchor="middle">voice mode</text>
    <rect x="386" y="335" width="150" height="36" rx="18" fill="#7A00F0" fill-opacity=".18" stroke="#9B30FF" stroke-opacity=".5"/>
    <text x="461" y="358" text-anchor="middle">image gen</text>
    <rect x="548" y="335" width="150" height="36" rx="18" fill="#ED1908" fill-opacity=".1" stroke="#FF6B5E" stroke-opacity=".5"/>
    <text x="623" y="358" text-anchor="middle">30+ tools</text>
  </g>
  <text x="1200" y="395" text-anchor="end" font-family="Consolas,monospace" font-size="16" fill="#7B6E96">bldbox.ir</text>
</svg>
