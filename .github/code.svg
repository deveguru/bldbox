<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <style>
      .f{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:14px}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A12"/><stop offset="1" stop-color="#0B0716"/></linearGradient>
    <radialGradient id="g" cx=".85" cy=".1" r=".6"><stop offset="0" stop-color="#00b7d8" stop-opacity=".25"/><stop offset="1" stop-color="#00b7d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".1" cy="1" r=".6"><stop offset="0" stop-color="#7A00F0" stop-opacity=".3"/><stop offset="1" stop-color="#7A00F0" stop-opacity="0"/></radialGradient>
    <linearGradient id="btn" x1="0" x2="1"><stop offset="0" stop-color="#00b7d8"/><stop offset="1" stop-color="#7A00F0"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#0C0E15"/></linearGradient>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#g)"/>
  <rect width="1280" height="560" rx="28" fill="url(#g2)"/>

  <!-- editor window -->
  <g transform="translate(56 64)">
    <rect width="620" height="432" rx="18" fill="url(#win)" stroke="#8fd8ff" stroke-opacity=".18"/>
    <circle cx="22" cy="20" r="5" fill="#ED1908"/><circle cx="40" cy="20" r="5" fill="#f5c542"/><circle cx="58" cy="20" r="5" fill="#3fe0a0"/>
    <rect x="236" y="9" width="150" height="22" rx="11" fill="#1B2030"/>
    <text x="311" y="25" text-anchor="middle" class="f" font-size="12" fill="#CFC3EA">Preview   |   Code</text>
    <rect x="12" y="40" width="170" height="380" rx="10" fill="#0E1119"/>
    <g class="m" fill="#8C9AB3" font-size="13.5">
      <text x="24" y="66">▾ frontend</text>
      <text x="44" y="90" fill="#fff">index.html</text>
      <text x="44" y="114">app.js</text>
      <text x="44" y="138">style.css</text>
      <text x="24" y="168">▾ backend</text>
      <text x="44" y="192">server.js</text>
      <text x="44" y="216">routes.js</text>
      <text x="24" y="246">package.json</text>
      <text x="24" y="270">README.md</text>
      <text x="24" y="300">.env.example</text>
    </g>
    <g class="m">
      <text x="200" y="66" fill="#5C6370">// BldBox Code · server.js</text>
      <text x="200" y="94"><tspan fill="#C678DD">import</tspan><tspan fill="#ABB2BF"> express </tspan><tspan fill="#C678DD">from</tspan><tspan fill="#98C379"> 'express'</tspan><tspan fill="#ABB2BF">;</tspan></text>
      <text x="200" y="120"><tspan fill="#C678DD">import</tspan><tspan fill="#ABB2BF"> { menu } </tspan><tspan fill="#C678DD">from</tspan><tspan fill="#98C379"> './routes.js'</tspan><tspan fill="#ABB2BF">;</tspan></text>
      <text x="200" y="156"><tspan fill="#C678DD">const</tspan><tspan fill="#E5C07B"> app</tspan><tspan fill="#ABB2BF"> = </tspan><tspan fill="#61AFEF">express</tspan><tspan fill="#ABB2BF">();</tspan></text>
      <text x="200" y="182"><tspan fill="#E5C07B">app</tspan><tspan fill="#ABB2BF">.</tspan><tspan fill="#61AFEF">use</tspan><tspan fill="#ABB2BF">(express.</tspan><tspan fill="#61AFEF">static</tspan><tspan fill="#ABB2BF">(</tspan><tspan fill="#98C379">'frontend'</tspan><tspan fill="#ABB2BF">));</tspan></text>
      <text x="200" y="208"><tspan fill="#E5C07B">app</tspan><tspan fill="#ABB2BF">.</tspan><tspan fill="#61AFEF">get</tspan><tspan fill="#ABB2BF">(</tspan><tspan fill="#98C379">'/api/menu'</tspan><tspan fill="#ABB2BF">, (req, res) =&gt;</tspan></text>
      <text x="224" y="234"><tspan fill="#ABB2BF">res.</tspan><tspan fill="#61AFEF">json</tspan><tspan fill="#ABB2BF">(menu));</tspan></text>
      <text x="200" y="270"><tspan fill="#E5C07B">app</tspan><tspan fill="#ABB2BF">.</tspan><tspan fill="#61AFEF">listen</tspan><tspan fill="#ABB2BF">(</tspan><tspan fill="#D19A66">3000</tspan><tspan fill="#ABB2BF">);</tspan></text>
    </g>
    <rect x="198" y="300" width="408" height="118" rx="12" fill="#0E1119" stroke="#8fd8ff" stroke-opacity=".12"/>
    <rect x="214" y="314" width="376" height="30" rx="8" fill="#2B1550"/>
    <text x="230" y="334" class="f" font-size="14" font-weight="700" fill="#fff">☕ My Café</text>
    <rect x="214" y="352" width="118" height="54" rx="8" fill="#1B2030"/><rect x="342" y="352" width="118" height="54" rx="8" fill="#1B2030"/><rect x="470" y="352" width="120" height="54" rx="8" fill="#1B2030"/>
    <text x="273" y="384" text-anchor="middle" class="f" font-size="12" fill="#CFC3EA">Espresso</text>
    <text x="401" y="384" text-anchor="middle" class="f" font-size="12" fill="#CFC3EA">Latte</text>
    <text x="530" y="384" text-anchor="middle" class="f" font-size="12" fill="#CFC3EA">Cheesecake</text>
  </g>

  <!-- copy -->
  <g transform="translate(736 0)" class="f">
    <text y="104" font-size="18" font-weight="700" fill="#00E5FF" letter-spacing="3">BLDBOX CODE</text>
    <text y="160" font-size="40" font-weight="800" fill="#fff">Describe your app.</text>
    <text y="210" font-size="40" font-weight="800" fill="#B266FF">Get the whole project.</text>

    <g transform="translate(0 262)">
      <circle cx="18" cy="0" r="18" fill="url(#btn)"/><text x="18" y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
      <text x="50" y="6" font-size="19" fill="#DDD3F0">Write what you need in plain words</text>
    </g>
    <g transform="translate(0 318)">
      <circle cx="18" cy="0" r="18" fill="url(#btn)"/><text x="18" y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
      <text x="50" y="6" font-size="19" fill="#DDD3F0">The AI plans and writes every file</text>
    </g>
    <g transform="translate(0 374)">
      <circle cx="18" cy="0" r="18" fill="url(#btn)"/><text x="18" y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
      <text x="50" y="6" font-size="19" fill="#DDD3F0">Live preview, ZIP export or push to GitHub</text>
    </g>
    <rect y="424" width="256" height="48" rx="24" fill="url(#btn)"/>
    <text x="128" y="454" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Start free on bldbox.ir</text>
    <text y="506" font-size="14" fill="#8C80A8">React · Vue · Node.js · Python · PHP · Go · Flutter</text>
  </g>
</svg>
