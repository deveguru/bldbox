<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460">
  <defs>
    <style>
      .f{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0716"/><stop offset=".55" stop-color="#06050C"/><stop offset="1" stop-color="#120611"/></linearGradient>
    <radialGradient id="g1" cx=".12" cy=".05" r=".6"><stop offset="0" stop-color="#7A00F0" stop-opacity=".55"/><stop offset="1" stop-color="#7A00F0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".95" cy=".05" r=".45"><stop offset="0" stop-color="#ED1908" stop-opacity=".28"/><stop offset="1" stop-color="#ED1908" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDD3F0"/><stop offset="1" stop-color="#FF9A90"/></linearGradient>
    <linearGradient id="btn" x1="0" x2="1"><stop offset="0" stop-color="#7A00F0"/><stop offset="1" stop-color="#B266FF"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B30FF"/><stop offset=".6" stop-color="#7A00F0"/><stop offset="1" stop-color="#ED1908"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16121F"/><stop offset="1" stop-color="#0D0B15"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C8BAE3" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1280" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="460" rx="28" fill="url(#g1)"/>
  <rect width="1280" height="460" rx="28" fill="url(#g2)"/>
  <g fill="#fff">
    <circle cx="610" cy="40" r="1.2" opacity=".7"/><circle cx="700" cy="420" r="1" opacity=".5"/><circle cx="1230" cy="380" r="1.4" opacity=".6"/>
    <circle cx="560" cy="300" r="1" opacity=".4"/><circle cx="1180" cy="70" r="1.1" opacity=".6"/><circle cx="80" cy="420" r="1" opacity=".5"/>
  </g>

  <!-- brand -->
  <g transform="translate(72 70)">
    <rect width="46" height="46" rx="14" fill="url(#mark)"/>
    <text x="23" y="32" text-anchor="middle" class="f" font-size="24" font-weight="800" fill="#fff">B</text>
    <text x="62" y="22" class="f" font-size="20" font-weight="700" fill="#fff">BldBox AI</text>
    <text x="62" y="42" class="f" font-size="13" fill="#9D91BA" letter-spacing="2">AI WORKSHOP · BLDBOX.IR</text>
  </g>

  <text x="72" y="190" class="f" font-size="50" font-weight="800" fill="url(#title)">The AI workshop that</text>
  <text x="72" y="248" class="f" font-size="50" font-weight="800" fill="url(#title)">actually does the work.</text>
  <text x="72" y="292" class="f" font-size="19" fill="#B6AACF">Chat, build full apps, design agents, generate images, talk by voice,</text>
  <text x="72" y="318" class="f" font-size="19" fill="#B6AACF">publish SEO articles and grow 3D worlds — all from one prompt box.</text>

  <g transform="translate(72 350)">
    <rect width="196" height="50" rx="25" fill="url(#btn)"/>
    <text x="98" y="31" text-anchor="middle" class="f" font-size="17" font-weight="700" fill="#fff">Open bldbox.ir  →</text>
    <rect x="212" width="236" height="50" rx="25" fill="none" stroke="#B266FF" stroke-opacity=".55"/>
    <text x="330" y="31" text-anchor="middle" class="f" font-size="16" font-weight="600" fill="#E5D5FF">🌍  world.bldbox.ir</text>
  </g>
  <text x="72" y="430" class="f" font-size="13" fill="#7B6E96">English &amp; Persian UI · RTL-first · dark neon theme · Sign in with GitHub</text>

  <!-- app window -->
  <g transform="translate(700 58)">
    <rect x="-6" y="-6" width="532" height="356" rx="26" fill="#9B30FF" opacity=".25" filter="url(#glow)"/>
    <rect width="520" height="344" rx="20" fill="url(#win)" stroke="#C8BAE3" stroke-opacity=".16"/>
    <circle cx="22" cy="20" r="5" fill="#ED1908"/><circle cx="40" cy="20" r="5" fill="#f5c542"/><circle cx="58" cy="20" r="5" fill="#3fe0a0"/>
    <!-- sidebar -->
    <rect x="12" y="38" width="132" height="294" rx="12" fill="#0D0B15" stroke="#C8BAE3" stroke-opacity=".08"/>
    <g class="f" font-size="11.5" fill="#ECE8F4">
      <rect x="22" y="50" width="112" height="24" rx="8" fill="#1B1827"/><text x="32" y="66">✎  New chat</text>
      <rect x="24" y="84" width="16" height="16" rx="5" fill="#00b7d8"/><text x="48" y="96">BldBox Code</text>
      <rect x="24" y="108" width="16" height="16" rx="5" fill="#00e59b"/><text x="48" y="120">Custom agents</text>
      <rect x="24" y="132" width="16" height="16" rx="5" fill="#ff2bd6"/><text x="48" y="144">Images</text>
      <rect x="24" y="156" width="16" height="16" rx="5" fill="#ff7a18"/><text x="48" y="168">Voice</text>
      <rect x="24" y="180" width="16" height="16" rx="5" fill="#7A00F0"/><text x="48" y="192">World Builder</text>
      <rect x="24" y="204" width="16" height="16" rx="5" fill="#B266FF"/><text x="48" y="216">Blog</text>
    </g>
    <g class="f" font-size="10.5" fill="#6f6787"><text x="24" y="246">CHATS</text></g>
    <rect x="24" y="254" width="100" height="7" rx="3.5" fill="#2a2638"/><rect x="24" y="270" width="84" height="7" rx="3.5" fill="#2a2638"/><rect x="24" y="286" width="92" height="7" rx="3.5" fill="#2a2638"/>
    <!-- chat -->
    <g class="f">
      <rect x="262" y="52" width="244" height="38" rx="14" fill="#2B1550"/>
      <text x="278" y="76" font-size="12.5" fill="#fff">Build me a landing page for my café</text>
      <rect x="160" y="104" width="300" height="94" rx="14" fill="#14121D" stroke="#C8BAE3" stroke-opacity=".1"/>
      <text x="174" y="128" font-size="12.5" fill="#fff" font-weight="700">✦ Done — 4 files ready</text>
      <text x="174" y="150" font-size="11.5" fill="#A99BC8">index.html · style.css · app.js · README.md</text>
      <rect x="174" y="162" width="88" height="24" rx="8" fill="#1F1A30"/><text x="186" y="178" font-size="11" fill="#E5D5FF">▶ Preview</text>
      <rect x="270" y="162" width="96" height="24" rx="8" fill="#1F1A30"/><text x="282" y="178" font-size="11" fill="#E5D5FF">⤓ Download ZIP</text>
      <rect x="160" y="210" width="190" height="22" rx="11" fill="#1B1827"/><text x="172" y="225" font-size="11" fill="#B266FF">◐ Creating the image…</text>
    </g>
    <!-- composer -->
    <rect x="158" y="268" width="348" height="60" rx="18" fill="#14121D" stroke="#C8BAE3" stroke-opacity=".18"/>
    <text x="174" y="292" class="f" font-size="12.5" fill="#6f6787">Ask anything…</text>
    <rect x="172" y="302" width="22" height="18" rx="9" fill="#1B1827"/><text x="178" y="315" class="f" font-size="12" fill="#9d94b4">+</text>
    <rect x="200" y="302" width="64" height="18" rx="9" fill="#1B1827"/><text x="210" y="315" class="f" font-size="10.5" fill="#9d94b4">🌐 Search</text>
    <circle cx="486" cy="306" r="13" fill="url(#btn)"/><path d="M486 312v-12M480 305l6-6 6 6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
